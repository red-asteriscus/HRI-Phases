<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="user-scalable=no, initial-scale=1.0">
    <title>Welcome - Graduation 2026</title>

    <link rel="stylesheet" type="text/css" href="../css/welcome.css">

    <!-- Needed to send events from the tablet page to Choregraphe -->
    <script src="/libs/qi/2/qi.js"></script>

    <!-- Cleaned Phase 2 page logic -->
    <script src="../js/welcome.js"></script>
</head>

<body>
    <div id="wrapper">
        <div id="top-bar"></div>

        <div id="container">
            <p id="event-label">USEK GRADUATION CEREMONY 2026</p>

            <div class="divider">
                <span>✦</span>
            </div>

            <div id="phase-track">
                <span id="step-welcome" class="phase-step">Welcome</span>
                <span id="step-ready" class="phase-step">Ready</span>
                <span id="step-speech" class="phase-step">Speech</span>
            </div>

            <div id="pepper-avatar" data-event="tabletWave" data-visual="wave">
                <div class="pepper-head">
                    <span class="eye eye-left"></span>
                    <span class="eye eye-right"></span>
                    <span class="mouth"></span>
                </div>

                <div class="pepper-body"></div>
            </div>

            <p id="intro-label">Loading...</p>

            <h1 id="question-text">Loading...</h1>

            <p id="phase-text">Loading...</p>

            <div class="divider">
                <span>✦</span>
            </div>

            <div id="button-container">
                <div id="group-yes-no" class="button-group">
                    <button class="btn btn-yes" type="button" data-event="yesAnswer">
                        Yes, we are ready
                    </button>

                    <button class="btn btn-no" type="button" data-event="noAnswer">
                        Not yet
                    </button>
                </div>
            </div>

            <div id="cue-panel">
                <button class="btn btn-cue" type="button" data-event="tabletWave" data-visual="wave">
                    Pepper Wave
                </button>

                <button class="btn btn-cue" type="button" data-event="tabletCheer" data-visual="confetti">
                    Confetti
                </button>
            </div>
        </div>

        <div id="confetti-area"></div>
    </div>
</body>
</html>
