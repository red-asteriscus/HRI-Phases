<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="user-scalable=no, initial-scale=1.0, maximum-scale=1.0">
    <title>Diploma Distribution</title>

    <link rel="stylesheet" href="../css/diploma_segment.css">

    <!-- Required for Pepper / Choregraphe ALMemory events -->
    <script src="/libs/qi/2/qi.js"></script>

    <!-- Main page logic -->
    <script src="../js/diploma_segment.js"></script>
</head>

<body>
    <div id="wrapper">
        <div id="top-bar"></div>

        <div id="container">
            <p id="event-label">USEK GRADUATION CEREMONY 2026</p>
            <p id="section-label">DIPLOMA DISTRIBUTION</p>

            <div id="stage-card">
                <div id="status-pill">
                    <span id="status-dot"></span>
                    <span id="intro-label"></span>
                </div>

                <table id="visual-table">
                    <tr>
                        <td class="visual-cell side-cell">
                            <div id="pepper-visual" class="visual-box">
                                <div class="pepper-head">
                                    <span class="eye eye-left"></span>
                                    <span class="eye eye-right"></span>
                                    <span class="mouth"></span>
                                </div>

                                <div class="pepper-body"></div>
                                <p>Pepper</p>
                            </div>
                        </td>

                        <td class="visual-cell visual-center">
                            <div id="center-badge">
                                <div id="speaker-badge"></div>

                                <div id="diploma-icon">
                                    <div class="diploma-paper"></div>
                                    <div class="diploma-ribbon"></div>
                                    <div class="diploma-line diploma-line-one"></div>
                                    <div class="diploma-line diploma-line-two"></div>
                                    <div class="diploma-seal"></div>
                                </div>
                            </div>
                        </td>

                        <td class="visual-cell side-cell">
                            <div id="guest-visual" class="visual-box">
                                <div id="guest-icon-frame">
                                    <div id="guest-icon" class="guest-icon">
                                        <div class="icon-hair"></div>
                                        <div class="icon-head"></div>
                                        <div class="icon-neck"></div>
                                        <div class="icon-body"></div>
                                        <div class="icon-accent"></div>
                                    </div>
                                </div>

                                <p id="guest-label"></p>
                            </div>
                        </td>
                    </tr>
                </table>

                <div id="speaker-panel">
                    <p id="phase-text"></p>
                    <h1 id="speaker-name"></h1>
                    <p id="speaker-title"></p>
                    <p id="helper-text"></p>
                </div>

                <button id="main-button" class="btn" type="button"></button>
            </div>
        </div>

        <div id="confetti-area"></div>
        <div id="fireworks-area"></div>
    </div>
</body>
</html>
